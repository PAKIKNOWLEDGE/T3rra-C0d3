[package]
name = "t3rra-c0d3-rhodes"
version = "0.1.0"
description = "T3rra-C0d3-Rhodes desktop coding-agent console"
authors = ["T3rra-C0d3"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
